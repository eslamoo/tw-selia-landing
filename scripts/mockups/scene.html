<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Listing mockups</title>
<!-- Rendered by scripts/make-marketplace.sh. ?scene=1..6, page crops from ./screens -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 1200px; overflow: hidden; }
  body { position: relative; background: radial-gradient(85% 70% at 50% 40%, #2c2e2e 0%, #1c1e1e 55%, #111212 100%); }
  .floor { position: absolute; left: 10%; right: 10%; bottom: 40px; height: 160px; border-radius: 50%; background: radial-gradient(closest-side, rgb(198 139 71 / 12%), rgb(198 139 71 / 0%)); }
  .dev { position: absolute; }
  .shadow { filter: drop-shadow(0 50px 60px rgb(0 0 0 / 55%)) drop-shadow(0 10px 16px rgb(0 0 0 / 35%)); }

  /* iPhone: a front face with the titanium sides drawn as strips around the outline */
  .ph { position: relative; transform-style: preserve-3d; }
  .ph-edge { position: absolute; background: linear-gradient(90deg, rgb(255 255 255 / 45%) 0 6%, rgb(255 255 255 / 0%) 18% 82%, rgb(255 255 255 / 35%) 94% 100%), hsl(240 3% var(--l)); }
  .ph-run { background: linear-gradient(90deg, rgb(255 255 255 / 45%) 0 6%, rgb(255 255 255 / 0%) 18% 82%, rgb(255 255 255 / 35%) 94% 100%), linear-gradient(180deg, rgb(0 0 0 / 30%), rgb(255 255 255 / 16%) 50%, rgb(0 0 0 / 30%)), hsl(240 3% var(--l)); }
  .ph-face { position: absolute; inset: 0; border-radius: var(--r); background: linear-gradient(140deg, #a4a4aa 0%, #4a4a4e 14%, #2a2a2d 45%, #3c3c40 75%, #b0b0b6 100%); }
  .ph-glass { position: absolute; inset: var(--ring); border-radius: calc(var(--r) - var(--ring)); background: #040404; box-shadow: inset 0 0 0 1px rgb(255 255 255 / 8%); }
  .ph-screen { position: absolute; inset: var(--bez); overflow: hidden; border-radius: calc(var(--r) - var(--ring) - var(--bez) * .85); background: #fff; }
  .ph-sb { position: relative; height: var(--sb); background: var(--sbg, #fff); }
  .ph-page { position: absolute; left: 0; right: 0; top: var(--sb); bottom: 0; background-size: 100% auto; background-position: 0 0; background-repeat: no-repeat; }
  .ph-island { position: absolute; left: 50%; top: calc(var(--sw) * .026); width: calc(var(--sw) * .31); height: calc(var(--sw) * .09); transform: translateX(-50%); border-radius: 999px; background: #000; }
  .ph-icons { position: absolute; top: calc(var(--sb) * .4); right: calc(var(--sw) * .07); display: flex; align-items: flex-end; gap: calc(var(--sw) * .012); }
  .ph-icons b { display: block; background: var(--sfg, #000); }
  .ph-glare { position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(118deg, rgb(255 255 255 / 10%) 0%, rgb(255 255 255 / 3%) 34%, rgb(255 255 255 / 0%) 34.2%); pointer-events: none; }
  .ph-side { position: absolute; top: 0; height: 100%; transform-style: preserve-3d; }
  .ph-btn { position: absolute; border-radius: 3px; background: linear-gradient(90deg, #2a2a2d, #8c8c92 45%, #3a3a3e); }

  /* MacBook Pro seen from the front, like Apple's product bezels */
  .mb-lid { position: relative; border-radius: var(--lr) var(--lr) calc(var(--lr) * .3) calc(var(--lr) * .3); background: linear-gradient(180deg, #d9dadd, #b9bbbf); padding: var(--edge); }
  .mb-glass { position: relative; height: 100%; border-radius: calc(var(--lr) - var(--edge)) calc(var(--lr) - var(--edge)) calc(var(--lr) * .2) calc(var(--lr) * .2); background: #050505; box-shadow: inset 0 0 0 1px rgb(255 255 255 / 6%); }
  .mb-screen { position: absolute; overflow: hidden; background: #000; border-radius: calc(var(--lr) * .35) calc(var(--lr) * .35) 0 0; }
  .mb-bar { height: var(--bar); background: #000; }
  .mb-page { position: absolute; left: 0; right: 0; top: var(--bar); bottom: 0; background-size: 100% auto; background-repeat: no-repeat; }
  .mb-notch { position: absolute; left: 50%; transform: translateX(-50%); background: #050505; border-radius: 0 0 calc(var(--bar) * .45) calc(var(--bar) * .45); }
  .mb-cam { position: absolute; left: 50%; top: 32%; width: 9px; height: 9px; margin-left: -4.5px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #2a3340, #0a0c10 70%); }
  .mb-glare { position: absolute; inset: 0; background: linear-gradient(115deg, rgb(255 255 255 / 7%) 0%, rgb(255 255 255 / 2%) 40%, rgb(255 255 255 / 0%) 40.2%); pointer-events: none; }
  .mb-hinge { position: relative; margin: 0 auto; background: linear-gradient(180deg, #1a1a1c, #3a3b3e); }
  .mb-base { position: relative; background: linear-gradient(180deg, #f1f2f4 0%, #c9cbcf 18%, #a9abb0 60%, #7f8186 100%); border-radius: 0 0 var(--br) var(--br); }
  .mb-base::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: rgb(255 255 255 / 85%); }
  .mb-scoop { position: absolute; left: 50%; top: 0; transform: translateX(-50%); border-radius: 0 0 10px 10px; background: linear-gradient(180deg, #8e9095, #b9bbbf); }
</style>
</head>
<body>
<div class="floor"></div>
<div id="stage"></div>
<script src="screens/colors.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const scene = Number(q.get("scene") || 1);
  const stage = document.getElementById("stage");

  // iPhone 16 Pro proportions, black titanium
  // A tiny tilt avoids a Chrome 3D sorting glitch at 2x when rotateX is exactly 0
  function phone({ x, y, w, ry = 0, rx = 0.01, rz = 0, src }) {
    const sbg = (window.SB || {})[src] || "#ffffff";
    const dark = [1, 3, 5].reduce((a, i) => a + parseInt(sbg.slice(i, i + 2), 16), 0) < 384;
    const h = w * 2.07, r = w * 0.165, t = w * 0.1, ring = w * 0.013, bez = w * 0.03;
    const sw = w - 2 * (ring + bez), sb = sw * 0.13;
    // Titanium sides: thin strips around the outline, straight runs plus 8 per rounded corner
    const edges = [];
    const strip = (px, py, phi, len, run) => {
      const lit = 20 + 30 * Math.max(0, Math.cos(((phi - 225) * Math.PI) / 180));
      edges.push(`<i class="ph-edge${run ? " ph-run" : ""}" style="left:${-t / 2}px;top:${-len / 2}px;width:${t}px;height:${len}px;--l:${lit}%;transform:translate3d(${px}px,${py}px,${-t / 2}px) rotateZ(${phi}deg) rotateY(90deg)"></i>`);
    };
    strip(0, h / 2, 180, h - 2 * r, true); strip(w, h / 2, 0, h - 2 * r, true);
    strip(w / 2, 0, 270, w - 2 * r, true); strip(w / 2, h, 90, w - 2 * r, true);
    const seg = 8, step = 90 / seg, segLen = 2 * r * Math.sin(((step / 2) * Math.PI) / 180) + 1;
    for (const [cx, cy, a0] of [[r, r, 180], [w - r, r, 270], [w - r, h - r, 0], [r, h - r, 90]]) {
      for (let k = 0; k < seg; k++) {
        const phi = a0 + step * (k + 0.5), rad = (phi * Math.PI) / 180;
        strip(cx + r * Math.cos(rad), cy + r * Math.sin(rad), phi, segLen, false);
      }
    }
    const btn = (top, len) => `<i class="ph-btn" style="left:${t * 0.22}px;width:${t * 0.56}px;top:${h * top}px;height:${h * len}px"></i>`;
    // Side planes stand at the left and right edges, facing out, and carry the buttons
    const side = (left, buttons) => `<div class="ph-side" style="left:${left ? 0 : w}px;width:${t}px;transform-origin:0 50%;transform:rotateY(90deg) translateZ(${left ? -1.5 : 1.5}px)">${buttons}</div>`;
    const icons = `<span class="ph-icons" style="--sfg:${dark ? "#fff" : "#000"}">
      ${[0.35, 0.55, 0.75, 1].map((v) => `<b style="width:${sw * 0.008}px;height:${sw * 0.028 * v}px;border-radius:1px"></b>`).join("")}
      <b style="width:${sw * 0.05}px;height:${sw * 0.024}px;margin-left:${sw * 0.012}px;border-radius:${sw * 0.007}px"></b></span>`;
    return `<div class="dev shadow" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
      <div class="ph" style="width:${w}px;height:${h}px;--r:${r}px;--ring:${ring}px;--bez:${bez}px;--sw:${sw}px;--sb:${sb}px;--sbg:${sbg};transform:perspective(2600px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)">
        ${edges.join("")}
        ${side(true, btn(0.17, 0.045) + btn(0.245, 0.075) + btn(0.34, 0.075))}
        ${side(false, btn(0.27, 0.11))}
        <div class="ph-face"><div class="ph-glass"><div class="ph-screen">
          <div class="ph-sb">${icons}</div><div class="ph-page" style="background-image:url('screens/${src}')"></div>
          <div class="ph-island"></div><div class="ph-glare"></div>
        </div></div></div>
      </div></div>`;
  }

  // MacBook Pro 14 proportions: 3024x1964 screen with the notch row in black, silver body
  function laptop({ x, y, w, src }) {
    const edge = w * 0.004, side = w * 0.017, top = w * 0.022, bottom = w * 0.03;
    const sw = w - 2 * (edge + side), shh = sw / 1.54, bar = sw * 0.022;
    const lidH = shh + top + bottom + 2 * edge;
    return `<div class="dev shadow" style="left:${x}px;top:${y}px;width:${w}px;--lr:${w * 0.02}px;--edge:${edge}px;--bar:${bar}px;--br:${w * 0.012}px">
      <div class="mb-lid" style="height:${lidH}px"><div class="mb-glass">
        <div class="mb-screen" style="left:${side}px;top:${top}px;width:${sw}px;height:${shh}px">
          <div class="mb-bar"></div><div class="mb-page" style="background-image:url('screens/${src}')"></div><div class="mb-glare"></div>
        </div>
        <div class="mb-notch" style="top:${top}px;width:${sw * 0.1}px;height:${bar}px"><i class="mb-cam"></i></div>
      </div></div>
      <div class="mb-hinge" style="width:${w * 0.86}px;height:${w * 0.006}px"></div>
      <div class="mb-base" style="width:${w * 1.04}px;margin-left:${-w * 0.02}px;height:${w * 0.017}px"><i class="mb-scoop" style="width:${w * 0.12}px;height:${w * 0.006}px"></i></div>
    </div>`;
  }

  const S = {
    // Abaya template: laptop and phone
    1: [laptop({ x: 150, y: 215, w: 1100, src: "d-abaya-top.png" }), phone({ x: 1135, y: 395, w: 300, ry: -16, src: "m-abaya-top.png" })],
    // Perfume template, mirrored
    2: [laptop({ x: 350, y: 215, w: 1100, src: "d-perfume-top.png" }), phone({ x: 165, y: 395, w: 300, ry: 16, src: "m-perfume-top.png" })],
    // Abaya sections on three phones
    3: [phone({ x: 165, y: 175, w: 410, ry: 30, src: "m-abaya-product.png" }), phone({ x: 1025, y: 175, w: 410, ry: -30, src: "m-abaya-banners.png" }),
        phone({ x: 580, y: 130, w: 440, src: "m-abaya-top.png" })],
    // Light and dark mode
    4: [phone({ x: 330, y: 150, w: 430, ry: 12, src: "m-abaya-product.png" }), phone({ x: 840, y: 150, w: 430, ry: -12, src: "m-abaya-product-dark.png" })],
    // Banners on desktop and phone
    5: [laptop({ x: 150, y: 215, w: 1100, src: "d-abaya-banners.png" }), phone({ x: 1135, y: 395, w: 300, ry: -16, src: "m-abaya-three.png" })],
    // Perfume sections on three phones
    6: [phone({ x: 165, y: 175, w: 410, ry: 30, src: "m-perfume-product.png" }), phone({ x: 1025, y: 175, w: 410, ry: -30, src: "m-perfume-reviews.png" }),
        phone({ x: 580, y: 130, w: 440, src: "m-perfume-top.png" })],
  };
  stage.innerHTML = S[scene].join("");
  Promise.all([...document.querySelectorAll("[style*=background-image]")].map((el) => new Promise((done) => {
    const img = new Image(); img.onload = img.onerror = done; img.src = el.style.backgroundImage.slice(5, -2);
  }))).then(() => (document.title = "ready"));
</script>
</body>
</html>
