<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Section preview frame</title>
<!-- Rendered by scripts/make-section-images.sh. ?name=<component>, section captures from ./src -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 800px; overflow: hidden; background: #f1f1f2; }
  .win { position: absolute; left: 70px; top: 64px; width: 1060px; height: 672px; overflow: hidden; border-radius: 14px; background: #fff; border: 1px solid #e3e3e6; box-shadow: 0 30px 70px rgb(0 0 0 / 9%), 0 3px 10px rgb(0 0 0 / 5%); }
  .bar { position: relative; height: 36px; background: #f7f7f8; border-bottom: 1px solid #ebebed; }
  .dot { position: absolute; top: 13px; width: 10px; height: 10px; border-radius: 50%; background: #d9d9dd; }
  .url { position: absolute; left: 50%; top: 9px; width: 320px; height: 18px; margin-left: -160px; border-radius: 6px; background: #ececef; }
  .view { position: relative; height: 636px; overflow: hidden; }
  .shot { position: absolute; left: 0; display: block; }
  .sk { position: absolute; border-radius: 10px; background: #f0f0f2; }
</style>
</head>
<body>
<div class="win">
  <div class="bar"><i class="dot" style="left:16px"></i><i class="dot" style="left:32px"></i><i class="dot" style="left:48px"></i><i class="url"></i></div>
  <div class="view" id="v"></div>
</div>
<script>
  const name = new URLSearchParams(location.search).get("name");
  const W = 1060, H = 636, SRC = 2880;
  const v = document.getElementById("v");
  const sk = (x, y, w, h, r) => `<i class="sk" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px${r != null ? `;border-radius:${r}px` : ""}"></i>`;
  // Gray stand-ins for the sections around the real one
  const header = (y) => sk(W / 2 - 50, y + 18, 100, 22, 6) + sk(24, y + 21, 16, 16, 8);
  const hero = (y, h) => sk(0, y, W, h, 0);
  const next = (y) => y > H - 60 ? "" : sk(W / 2 - 90, y + 30, 180, 14, 7)
    + [0, 1, 2, 3].map((i) => sk(40 + i * 250, y + 70, 230, Math.max(0, Math.min(220, H - y - 70)))).join("");
  const prev = (h) => h < 30 ? "" : `<i class="sk" style="left:40px;top:0;width:${W - 80}px;height:${h - 28}px;border-radius:0 0 10px 10px"></i>`;

  const img = new Image();
  img.onload = () => {
    let s = W / img.naturalWidth, x = 0, y, html = "";
    const h = () => img.naturalHeight * s;
    // The header and slider captures show the transparent header over the slider, so they sit at the top
    if (name === "page-header" || name === "advanced-slider") { y = 0; html = next(h()); }
    else if (name === "animated-text") { y = 58; html = header(0) + hero(y + h(), 380) + next(y + h() + 380); }
    else if (h() > H) { s = H / img.naturalHeight; x = (W - img.naturalWidth * s) / 2; y = 0; }
    else { y = Math.round(Math.min(150, (H - h()) / 2)); html = prev(y) + next(y + h()); }
    v.innerHTML = html + `<img class="shot" src="${img.src}" style="left:${x}px;top:${y}px;width:${img.naturalWidth * s}px" />`;
    document.title = "ready";
  };
  img.src = `src/section-${name}.png`;
</script>
</body>
</html>
